name: Daily job alert

on:
  schedule:
    # 02:30 UTC = 08:00 IST. GitHub may start scheduled runs several minutes late under load.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the digest to the log, send nothing, do not update state"
        type: boolean
        default: false
      initial_digest:
        description: "If there is no state file yet, send all current matches instead of silently seeding"
        type: boolean
        default: false
      test_email:
        description: "Only send a test email to check the Gmail secrets, then stop (no job search)"
        type: boolean
        default: false

# The state file is committed back to the repository.
permissions:
  contents: write

# Never run two alerts at once: they would race on the state file.
concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check careers pages and notify
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
          INITIAL_DIGEST: ${{ inputs.initial_digest }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          args=(--config config/jobalert.config.json --state data/seen-jobs.json)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INITIAL_DIGEST" = "true" ]; then args+=(--initial-digest); fi
          if [ "$TEST_EMAIL" = "true" ]; then args+=(--test-email); fi
          dotnet run --project src/JobAlertAgent -c Release -- "${args[@]}"

      - name: Commit updated state
        if: success() && inputs.dry_run != true && inputs.test_email != true
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen-jobs.json
          if git diff --cached --quiet; then
            echo "State unchanged; nothing to commit."
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
