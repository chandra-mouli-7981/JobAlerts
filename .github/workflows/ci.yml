name: CI

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet test JobAlertAgent.sln -c Release --nologo
